name: CI
#
# Portée volontairement limitée à ce stade : le gate
# test → build, pas de push vers un registre (GHCR). Ce dépôt n'a pas
# encore de remote GitHub actif

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances (dev complet — pour exécuter toute la suite de tests)
        run: pip install -r requirements.txt

      - name: Tests (unitaires + contract test modèle + API)
        run: pytest -v

  evaluate-model:
    needs: test  # ← même garde-fou : pas de vérif modèle si le code casse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Évaluation continue — seuils bloquants (fiche 517)
        run: python scripts/evaluate_model.py

  build:
    needs: test  # ← garde-fou : pas de build si les tests cassent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le volume runtime (écriture par le conteneur non-root)
        # chmod 777 : runner GitHub Actions éphémère, détruit en fin de job
        run: mkdir -p data/runtime && chmod 777 data/runtime

      - name: Construire les images (backend + frontend)
        run: docker compose build

      - name: Vérifier que le backend démarre et répond (/health)
        run: |
          docker compose up -d
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "API saine."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || { echo "Backend KO"; docker compose logs; exit 1; }

      - name: Vérifier la boucle de feedback de bout en bout (Étape 12)
        run: |
          PAYLOAD='{"age":35,"anciennete_poste_ans":3.0,"niveau_diplome":"Bac+2","code_rome_vise":"D1503","code_insee_commune":"18273","est_allocataire":true,"synthese_entretien":"ci"}'
          REQUEST_ID=$(curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d "$PAYLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['request_id'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/feedback -H "Content-Type: application/json" -d "{\"request_id\": \"$REQUEST_ID\", \"true_label\": 1}")
          if [ "$STATUS" != "201" ]; then
            echo "Feedback round-trip KO (HTTP $STATUS)"; docker compose logs backend; exit 1
          fi
          echo "Feedback round-trip OK."

      - name: Vérifier que le frontend répond
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Frontend sain."
              exit 0
            fi
            sleep 2
          done
          echo "Le frontend n'a jamais répondu à temps."
          docker compose logs frontend
          exit 1

      - name: Arrêter la stack
        if: always()
        run: docker compose down
