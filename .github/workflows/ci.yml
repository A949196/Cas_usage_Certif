name: CI
#
# Portée volontairement limitée à ce stade : le gate
# test → build, pas de push vers un registre (GHCR). Ce dépôt n'a pas
# encore de remote GitHub actif

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances (dev complet — pour exécuter toute la suite de tests)
        run: pip install -r requirements.txt

      - name: Tests (unitaires + contract test modèle + API)
        run: pytest -v

  evaluate-model:
    needs: test  # ← même garde-fou : pas de vérif modèle si le code casse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Évaluation continue — seuils bloquants (fiche 517)
        run: python scripts/evaluate_model.py

  build:
    needs: test  # ← garde-fou : pas de build si les tests cassent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du backend
        run: docker compose build

      - name: Vérifier que le conteneur démarre et répond (/health)
        run: |
          docker compose up -d
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "API saine."
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a jamais répondu /health à temps."
          docker compose logs
          exit 1

      - name: Arrêter la stack
        if: always()
        run: docker compose down
