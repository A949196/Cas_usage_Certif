# `backend`— API de scoring.
# `frontend` — interface conseiller Streamlit.
# `prometheus`/`grafana` — observabilité : scrape
# `backend:8000/metrics`, dashboard provisionné (pas d'import manuel).

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: trajectoire-emploi-api:v0.1.0-api
    ports:
      - "8000:8000"
    volumes:
      # Store SQLite (prédictions servies + feedbacks conseillers) — persisté
      # côté hôte, jamais versionné (cf. .gitignore).
      - ./data/runtime:/home/appuser/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: trajectoire-emploi-ui:v0.1.0-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.1
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  default:
    driver: bridge
